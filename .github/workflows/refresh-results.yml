name: Refresh NFL results

on:
  schedule:
    - cron: '17 6 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-results-refresh
  cancel-in-progress: false

jobs:
  refresh-results:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh schedule and final scores
        run: python src/load_data.py

      - name: Record refresh time
        run: |
          python -c "from datetime import datetime, timezone; from pathlib import Path; Path('data/last_updated.txt').write_text(datetime.now(timezone.utc).isoformat(), encoding='utf-8')"

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule_2026.csv data/last_updated.txt

          if git diff --cached --quiet; then
            echo "No schedule or score changes to commit."
          else
            git commit -m "Auto-refresh NFL results"
            git push
          fi
